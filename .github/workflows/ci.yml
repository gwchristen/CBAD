name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CBAD.sln

      - name: Build
        run: dotnet build CBAD.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CBAD.sln --no-build --configuration Release --verbosity normal
